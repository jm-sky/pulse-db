name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (lint, typy, testy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Ruff (lint)
        working-directory: backend
        run: ruff check .

      - name: Black (format check)
        working-directory: backend
        run: black --check .

      - name: Mypy (typy)
        working-directory: backend
        run: mypy .

      - name: Pytest (testy)
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend (lint, typy, testy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test:run
