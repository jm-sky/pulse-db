name: pulse-db-dev

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: pulse-db-backend:dev
    container_name: pulse-db-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      # Secrets and app config live here. Do not re-list them under environment:
      # with ${VAR} — empty host interpolation would override env_file values.
      - ./backend/.env
    environment:
      # Docker-network overrides only
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PROJECT_NAME=${PROJECT_NAME:-pulse-db}
      - APP_PORT=${APP_PORT:-8000}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-backend}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-pulse_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app:rw,delegated
      - ./backend/scripts:/app/scripts:rw,delegated
      - ./backend/tests:/app/tests:rw,delegated
      - ./backend/migrations:/app/migrations:rw,delegated
      - ./backend/main.py:/app/main.py:rw,delegated
      - ./backend/cli:/app/cli:rw,delegated
      - ./backend/cli.py:/app/cli.py:rw,delegated
      - ./backend/pyproject.toml:/app/pyproject.toml:ro,delegated
      - ./backend/seeds:/app/seeds:rw,delegated
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - pulse-db-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
    container_name: pulse-db-frontend
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    env_file:
      - ./.env
    environment:
      - CI=true
      - VITE_PORT=${VITE_PORT:-5176}
      - VITE_API_PROXY_URL=http://app:8000
    ports:
      - "127.0.0.1:${VITE_PORT:-5176}:${VITE_PORT:-5176}"
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
      - frontend_pnpm_store:/pnpm/store
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0 --port ${VITE_PORT:-5176}"
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - pulse-db-network

  db:
    image: postgres:17-alpine
    container_name: pulse-db-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-pulse_db}
      - POSTGRES_USER=${POSTGRES_USER:-backend}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pulse_db_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backend}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - pulse-db-network

  redis:
    image: redis:8-alpine
    container_name: pulse-db-redis
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
    volumes:
      - pulse_db_redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-changeme}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a $${REDIS_PASSWORD:-changeme} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - pulse-db-network

networks:
  pulse-db-network:
    name: pulse-db-network

volumes:
  pulse_db_postgres_data:
    name: pulse_db_postgres_data
  pulse_db_redis_data:
    name: pulse_db_redis_data
  frontend_node_modules:
    name: pulse_db_frontend_node_modules
  frontend_pnpm_store:
    name: pulse_db_frontend_pnpm_store
